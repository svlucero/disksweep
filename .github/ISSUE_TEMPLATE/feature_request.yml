name: Feature request
description: Suggest an improvement to DiskSweep.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this change address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Could this affect scan scope, selection, or permanent deletion behavior?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related links if useful.
